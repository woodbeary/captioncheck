[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "captioncheck"
version = "0.1.0"
description = "Caption and subtitle QC that reads like a Deaf viewer: sync, completeness, reading rate, pixel line width, and sound and tone flagged for a person."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Lopez" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
test = ["pytest>=8"]

[project.scripts]
captioncheck = "captioncheck.cli:main"

[tool.setuptools]
packages = ["captioncheck", "captioncheck.checks"]

[tool.setuptools.package-data]
captioncheck = ["data/glyphs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "clips: needs the fetched Tears of Steel clips (scripts/fetch_clips.py)",
  "whisper: runs the speech model live (pip install '.[whisper]')",
]
