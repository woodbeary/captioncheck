name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_whisper:
        description: "Also run the speech model live (downloads about half a gigabyte)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: unit and synthetic (no network, no model)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
      - run: pytest -q -m "not clips and not whisper"

  golden:
    name: real clip, planted defects, recorded Whisper timings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - uses: actions/cache@v4
        with:
          path: clips/cache
          key: clips-${{ hashFiles('clips/manifest.json', 'captioncheck/audio.py') }}
      - name: Fetch clips (byte ranges; every SHA-256 checked)
        run: python scripts/fetch_clips.py
      - name: Golden tests
        env:
          CAPTIONCHECK_REQUIRE_CLIPS: "1"
        run: pytest -q -m "clips and not whisper"
      - name: Report on the official subtitles (expected to fail, exit 1)
        run: |
          set +e
          captioncheck check clips/cache/TOS-en.srt --audio clips/cache/set.mix.wav \
            --me clips/cache/set.me.wav --start 336 \
            --words tests/fixtures/words/set.small.en.json --jsonl set.findings.jsonl
          test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: findings
          path: set.findings.jsonl

  live-whisper:
    name: live speech model (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.live_whisper
    needs: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test,whisper]"
      - uses: actions/cache@v4
        with:
          path: clips/cache
          key: clips-${{ hashFiles('clips/manifest.json', 'captioncheck/audio.py') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small.en-d1d751a5
      - run: python scripts/fetch_clips.py
      - env:
          CAPTIONCHECK_REQUIRE_CLIPS: "1"
          CAPTIONCHECK_LIVE_WHISPER: "1"
        run: pytest -q -m whisper
